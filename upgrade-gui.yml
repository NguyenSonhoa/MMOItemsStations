upgrade-gui:
  title: "&8ᴜᴘɢʀᴀᴅᴇ ѕᴛᴀᴛɪᴏɴ"
  size: 45
  # Slot configuration
  slots:
    upgrade-item: 10
    confirm-button: 16
    preview-item: 13
    chance-item: 11
    # Material display slots (optional)
    # If not set, or empty list, materials won't be displayed in separate slots
    material-display: [28,29,30,31,32,33,34]

  # Filler item for empty slots
  filler:
    material: "GRAY_STAINED_GLASS_PANE"
    custom-model-data: 1
    name: " "

  items:
    confirm-button:
      material: "LIME_STAINED_GLASS_PANE"
      name: "&a&lᴄᴏɴꜰɪʀᴍ ᴜᴘɢʀᴀᴅᴇ"
      custom-model-data: 0
      lore:
        - "&7Click to upgrade your item."
        - "&7Cost: &e%cost%$"
        - "&7Materials:"
        - "%materials%" # This placeholder will be replaced by the list of materials
        - "&7Success Rate: &a%success_rate%%"
    
    # This button is shown when no item is in the upgrade slot
    no-item-button:
      material: "RED_STAINED_GLASS_PANE"
      name: "&c&lɴᴏ ɪᴛᴇᴍ"
      custom-model-data: 0
      lore:
        - "&7Please place an item"
        - "&7in the slot to upgrade."

    chance-item-display:
      material: "YELLOW_STAINED_GLASS_PANE"
      name: "&e&lᴄʜᴀɴᴄᴇ ɪᴛᴇᴍ"
      custom-model-data: 0
      lore:
        - "&7Place a chance item here"
        - "&7to increase success rate."

    preview-item-display:
      material: "BLUE_STAINED_GLASS_PANE"
      name: "&b&lᴘʀᴇᴠɪᴇᴡ"
      custom-model-data: 0
      lore:
        - "&7The upgraded item will"
        - "&7appear here."

  # Settings for material display items in the GUI
  material-display:
    enabled: true
    # Lore format for the displayed material item
    # %status% will be replaced with ✔ or ❌
    lore:
      - "&7Amount: &e%amount%"
      - "&7Status: %status%"
    # Custom status messages
    status-met: "&a✔"
    status-not-met: "&c❌"
  
  chance-item:
    # Increase percentage success rate
    increase-chance: 10.0
    # Options: VANILLA, MMOITEMS
    type: MMOITEMS
    # Vanilla Material name or MMOItem ID
    id: SUCCESS_GEM
    # Only required if type is MMOITEMS (e.g. MATERIAL, CONSUMABLE)
    mmoitem-type: CONSUMABLE